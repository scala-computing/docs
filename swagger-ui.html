<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Simulation API - Interactive Explorer</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
    <style>
        html {
            box-sizing: border-box;
        }
        
        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        
        /* Header styling */
        .swagger-header {
            background: linear-gradient(135deg, #1a365d 0%, #2d3748 100%);
            color: white;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .swagger-header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .swagger-header .version {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.875rem;
        }
        
        /* Swagger UI customizations */
        .swagger-ui .topbar {
            display: none;
        }
        
        .swagger-ui .info {
            margin: 20px 0;
        }
        
        .swagger-ui .info .title {
            font-size: 1.75rem;
            color: #1a365d;
        }
        
        .swagger-ui .opblock-tag {
            border-bottom: 1px solid #e2e8f0;
            font-size: 1.25rem;
        }
        
        .swagger-ui .opblock-tag:hover {
            background: #f7fafc;
        }
        
        .swagger-ui .opblock.opblock-get {
            border-color: #61affe;
            background: rgba(97, 175, 254, 0.1);
        }
        
        .swagger-ui .opblock.opblock-post {
            border-color: #49cc90;
            background: rgba(73, 204, 144, 0.1);
        }
        
        .swagger-ui .opblock.opblock-put {
            border-color: #fca130;
            background: rgba(252, 161, 48, 0.1);
        }
        
        .swagger-ui .opblock.opblock-patch {
            border-color: #50e3c2;
            background: rgba(80, 227, 194, 0.1);
        }
        
        .swagger-ui .opblock.opblock-delete {
            border-color: #f93e3e;
            background: rgba(249, 62, 62, 0.1);
        }
        
        .swagger-ui .btn.authorize {
            background: #1a365d;
            border-color: #1a365d;
            color: white;
        }
        
        .swagger-ui .btn.authorize:hover {
            background: #2d3748;
        }
        
        .swagger-ui .btn.execute {
            background: #49cc90;
            border-color: #49cc90;
        }
        
        .swagger-ui .btn.execute:hover {
            background: #3cb37a;
        }
        
        /* Loading state */
        #swagger-ui-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            color: #718096;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e2e8f0;
            border-top-color: #1a365d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Error state */
        .error-message {
            background: #fed7d7;
            border: 1px solid #fc8181;
            color: #c53030;
            padding: 16px 24px;
            border-radius: 8px;
            margin: 20px 40px;
        }
        
        /* Footer */
        .swagger-footer {
            background: #f7fafc;
            border-top: 1px solid #e2e8f0;
            padding: 20px 40px;
            text-align: center;
            color: #718096;
            font-size: 0.875rem;
        }
        
        .swagger-footer a {
            color: #1a365d;
            text-decoration: none;
        }
        
        .swagger-footer a:hover {
            text-decoration: underline;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .swagger-header {
                padding: 15px 20px;
                flex-direction: column;
                gap: 10px;
            }
            
            .swagger-ui .wrapper {
                padding: 0 15px;
            }
        }
    </style>
</head>
<body>
    <header class="swagger-header">
        <h1>Network Simulation API</h1>
        <span class="version">v1.0.0</span>
    </header>
    
    <div id="swagger-ui">
        <div id="swagger-ui-loading">
            <div class="loading-spinner"></div>
            <span>Loading API documentation...</span>
        </div>
    </div>
    
    <footer class="swagger-footer">
        <p>
            <a href="./introduction.html">Back to Documentation</a> |
            <a href="https://github.com/scala-computing/scala" target="_blank">GitHub</a> |
            <a href="mailto:support@scalacomputing.com">Support</a>
        </p>
        <p>&copy; 2024 Scala Computing. All rights reserved.</p>
    </footer>
    
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js" crossorigin></script>
    <script>
        window.onload = function() {
            // Try to load the bundled OpenAPI spec
            // First try relative path, then fall back to inline spec
            const specUrl = './openapi-bundled.json';
            
            const ui = SwaggerUIBundle({
                url: specUrl,
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                defaultModelsExpandDepth: 1,
                defaultModelExpandDepth: 1,
                docExpansion: "list",
                filter: true,
                showExtensions: true,
                showCommonExtensions: true,
                syntaxHighlight: {
                    activate: true,
                    theme: "monokai"
                },
                tryItOutEnabled: true,
                requestInterceptor: (request) => {
                    // Log requests for debugging
                    console.log('API Request:', request);
                    return request;
                },
                responseInterceptor: (response) => {
                    console.log('API Response:', response);
                    return response;
                },
                onComplete: function() {
                    console.log('Swagger UI loaded successfully');
                    // Remove loading indicator
                    const loading = document.getElementById('swagger-ui-loading');
                    if (loading) {
                        loading.style.display = 'none';
                    }
                },
                onFailure: function(err) {
                    console.error('Swagger UI failed to load:', err);
                    const container = document.getElementById('swagger-ui');
                    container.innerHTML = `
                        <div class="error-message">
                            <strong>Error loading API specification</strong>
                            <p>Could not load the OpenAPI specification. Please ensure the documentation has been built correctly.</p>
                            <p>Technical details: ${err.message || err}</p>
                        </div>
                    `;
                }
            });
            
            window.ui = ui;
        };
    </script>
</body>
</html>
