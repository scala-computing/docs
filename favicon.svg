  <style>
    .outer { fill: #152432; }
    @media (prefers-color-scheme: dark) { .outer { fill: #FFFFFF; } }
  </style>
  <g class="outer">
    <rect width="9" height="9"/>
    <rect x="12" width="9" height="9"/>
    <rect x="24" width="9" height="9"/>
    <rect y="12" width="9" height="9"/>
    <rect x="24" y="12" width="9" height="9"/>
    <rect y="24" width="9" height="9"/>
    <rect x="12" y="24" width="9" height="9"/>
    <rect x="24" y="24" width="9" height="9"/>
  </g>
  <rect x="12" y="12" width="9" height="9" fill="#A3E5FF"/>
</svg>
